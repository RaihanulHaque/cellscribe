services:
  librethinkeragent-gateway:
    build: .
    container_name: librethinkeragent-gateway
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "${LIBRETHINKERAGENT_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - librethinkeragent-data:/data
      - ../vendor:/app/vendor:ro
    # The gateway holds the Mistral key and every device token. Keep it on the
    # internal network only; do not publish it to the internet.
    networks:
      - librethinkeragent

volumes:
  librethinkeragent-data:

networks:
  librethinkeragent:
    driver: bridge
