services:
  librethinker-gateway:
    build: .
    container_name: librethinker-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - librethinker-data:/data
      - ../vendor:/app/vendor:ro
    # The gateway holds the Mistral key and every device token. Keep it on the
    # internal network only; do not publish it to the internet.
    networks:
      - librethinker

volumes:
  librethinker-data:

networks:
  librethinker:
    driver: bridge
